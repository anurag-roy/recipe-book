services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/food-journal
      "

  app:
    build: .
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: .data/database.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
      OPENAI_TRACING: ${OPENAI_TRACING:-true}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: food-journal
      S3_REGION: us-east-1
      SWIGGY_OAUTH_REDIRECT_URI: http://localhost:3000/api/swiggy/callback
    volumes:
      - app-data:/app/.data
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          'fetch("http://localhost:3000/api/settings/status").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  minio-data:
  app-data:
